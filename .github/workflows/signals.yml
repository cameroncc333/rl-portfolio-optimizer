name: Sector Command Signals

on:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '0 13 * * 6'
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-full.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-full.txt
          pip install twilio gspread google-auth

      - name: Decode Google credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
        run: |
          printf '%s' "$GOOGLE_CREDS_B64" | base64 -d > creds.json
          if [ ! -s creds.json ]; then
            echo "ERROR: creds.json is empty after decode"
            exit 1
          fi
          echo "creds.json decoded successfully ($(wc -c < creds.json) bytes)"

      - name: Download trained models
        run: |
          echo "Downloading models-live.tar.gz from GitHub Release..."
          curl -L -o models-live.tar.gz \
            https://github.com/cameroncc333/rl-portfolio-optimizer/releases/download/v1.0-models/models-live.tar.gz
          echo "Verifying download..."
          ls -lh models-live.tar.gz
          echo "Extracting..."
          tar -xzf models-live.tar.gz
          rm models-live.tar.gz
          mv models-live models
          echo "Models in place:"
          ls models/

      - name: Run Signal Server
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_PHONE: ${{ secrets.TWILIO_PHONE }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GOOGLE_CREDS_PATH: creds.json
        run: python signal_server.py --dry-run

      - name: Log result
        if: always()
        run: echo "Signal server completed at $(date)"
